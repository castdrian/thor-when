name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: format check
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: type check
        run: npm run check
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
